# Empress Buffer++
# 效果器詳細技術資料

version: 1.0
last_updated: 2026-01-02
data_source: "Official website, web research"

# 基本資訊
basic_info:
  id: "empress_buffer_plus_plus"
  brand: "Empress Effects"
  model: "Buffer++"
  full_name: "Empress Effects Buffer++ I/O Interface & Signal Router"
  type: "utility"
  category: "buffer_router_interface"
  made_in: "Canada"
  release_year: 2025
  successor_to: "Stereo Buffer+"

# 價格資訊
price:
  msrp: 399  # USD
  street_price: 299  # USD (2026, 25% off promotion)
  currency: "USD"
  tier: "professional_utility"
  value_proposition: "Multi-功能 utility pedal, 取代多個單功能設備"

# 核心規格
technical_specs:
  type: "All-analog buffer, router, interface, boost"
  signal_path: "All-analog, pristine transparent buffering"

  inputs:
    count: 2
    type: "1/4 inch phone jack"
    impedance:
      in_1: "10kΩ – 1MΩ（由 in 1 loading 旋鈕可變）"
      in_2: "1MΩ（固定）"
    features:
      - "Visual input metering (LED indicators)"
      - "Switchable input pads (處理熱訊號)"
      - "Variable input loading (模擬線材音色)"

  outputs:
    count: 2
    type: "1/4 inch phone jack"
    configuration: "Stereo or dual-mono"
    features:
      - "Output A: Standard output"
      - "Output B: Transformer-isolated (ground loop rejection)"

  loops:
    count: 2
    type: "Effects send/return loops"
    stereo_capability: true
    features:
      - "Loop 1: Configurable routing"
      - "Loop 2: Configurable routing, stereo capable"
      - "Differential FX loop returns (noise rejection)"

  boost:
    max_gain: "30dB"
    type: "Footswitchable clean boost"
    control: "Footswitch activation"

  routing_modes:
    count: 12
    description: "12 internal routing configurations"

  power:
    voltage: "9V DC center-negative"
    current: "100mA minimum"
    connector: "2.1mm barrel"
    type: "Standard 9V DC adapter (center negative)"
    # 2026-09-11：原本全是預估，已依官方手冊 rev04 補實。

  dimensions:
    width: "3.5 in (88.9 mm)"
    depth: "4.5 in (114.3 mm)"
    height: "2 in (50.8 mm)"
    weight: "454g (1.0 lb)"

  # 2026-09-11 補齊：原本 footswitch/knob/switch 三項的數量與功能全是 TBD。
  # 依官方使用手冊 rev04 補實，並實際比對面板圖。
  # 手冊：https://empresseffects.com/cdn/shop/files/BUPP_User_Manual_rev04_Web.pdf
  controls:
    footswitches:
      count: 1
      note: "只有一個 footswitch，位於機身下緣正中央。它是多功能的，行為由 routing mode 與 fsw function 撥桿共同決定"
      functions:
        - "Boost 開關（Mode 1-5，fsw function 撥在 boost）"
        - "A/B 與 A/Y 選擇（Mode 1-5）：Mode 1-3 選輸出、Mode 4 選 summed 或 independent loop return、Mode 5 選哪個 loop 餵兩個輸出"
        - "Independent / Summed 輸出切換（Mode 6；此 mode 下 fsw function 撥桿無作用）"
        - "Momentary loop 切換／loop sum（Mode 7-8，長按；放開回到 Loop 1）"
        - "Instrument select 點踏切換（Mode 9-12）"
        - "Silent Tuning（長按；Mode 7-8 的內建 footswitch 不支援）"
        - "進入 Configuration Mode（開機時長按），點踏捲動 routing mode，長按存檔離開"

    knobs:
      count: 2
      items:
        - name: "boost"
          location: "top panel, centre"
          function: "clean boost 量，0 到 +30dB"
          control_kind: "continuous"
          note: "fsw function 撥在 a/b 或 a/y 且未指派外部開關給 boost 時，boost 恆為啟動；要無增益就逆時針轉到底"
        - name: "in 1 loading"
          location: "right side of enclosure (side-mounted)"
          function: "調整 In 1 的輸入阻抗，順時針到底 1MΩ，逆時針降到 10kΩ，模擬長線材的高頻滾降"
          control_kind: "continuous"
          note: "只作用於 In 1。In 2 的阻抗固定 1MΩ"

    switches:
      count: 6
      layout: "頂板兩列：上排 4 個（in 1 pad、noise filter 1、in 2 pad、noise filter 2），下排 2 個（fsw function、out 2 polarity）。沒有 dip switch"
      items:
        - name: "in 1 pad"
          positions: ["-6 dB", "0 dB", "-12 dB"]
          function: "衰減 In 1 的輸入電平；中間位置不衰減"
          control_kind: "discrete"
        - name: "in 2 pad"
          positions: ["-6 dB", "0 dB", "-12 dB"]
          function: "衰減 In 2 的輸入電平；中間位置不衰減"
          control_kind: "discrete"
        - name: "noise filter 1"
          positions: ["little", "none", "lots"]
          function: "Loop 1 的 Dolby 式降噪量"
          control_kind: "discrete"
        - name: "noise filter 2"
          positions: ["little", "none", "lots"]
          function: "Loop 2 的 Dolby 式降噪量"
          control_kind: "discrete"
        - name: "fsw function"
          positions: ["boost", "a/b", "a/y"]
          function: "決定 footswitch 在 Mode 1-5 的行為；Mode 6-12 不使用。在 Configuration Mode 中改為指派外部開關（左=Boost、右=Silent Tuning、中=不指派）"
          control_kind: "discrete"
          source_conflict: "手冊 p.2 寫 Modes 1-6，但 p.5 與 Mode 6 專頁都寫該撥桿在 Mode 6 無作用。實際有效範圍是 Mode 1-5。兩種說法都是官方原文，此處不代為取捨，兩面都記"
        - name: "out 2 polarity"
          positions: ["normal", "inverted"]
          function: "反轉 Out 2 的極性，處理雙音箱／stereo 設置的相位抵消"
          control_kind: "discrete"

    not_a_control:
      - "routing mode 不是實體開關。12 種 mode 透過 Configuration Mode（開機長按 footswitch）選擇，原本 YAML 把它列在 switches.functions 是錯的"

  # 面板實體配置（依手冊面板圖）
  panel_layout:
    jacks:
      left_side: ["tuner out", "loop out 1", "loop out 2", "loop in 1", "loop in 2"]
      right_side: ["in 1", "in 2", "out 1", "out 2 (transformer-isolated)"]
      top_edge: ["DC in"]
    leds:
      mini_leds: 6
      boost_led: 1
      input_led_colors:
        unlit: "無訊號"
        green: "有訊號"
        red: "削波"
        orange: "input 未啟用（Mode 9-12）"

  external_switch:
    supported: true
    type: "normally-open momentary"
    assignable_to: ["Boost", "Silent Tuning"]
    assigned_via: "Configuration Mode + fsw function 撥桿位置"
    unknown: "要插哪個孔，手冊、官方產品頁、面板圖三者皆未指明，也沒說是 TS 還是 TRS"

# 12 種路由模式詳細說明
routing_modes_details:
  mode_1:
    name: "Independent (Stereo) Loops"
    description: "兩個完全獨立的 stereo loops"
    use_case: "完整 stereo 效果器鏈"
    signal_flow: "Input → Loop 1 (stereo) → Loop 2 (stereo) → Output (stereo)"

  mode_2:
    name: "Summed Loops"
    description: "合併 loop 1 和 loop 2 訊號"
    use_case: "Parallel effects 處理"
    signal_flow: "Input → Loop 1 + Loop 2 (parallel) → Summed output"

  mode_3:
    name: "Loop In 1 Only"
    description: "只使用 Loop 1，Loop 2 bypass"
    use_case: "簡化訊號鏈，只使用 Loop 1"
    signal_flow: "Input → Loop 1 → Output (Loop 2 bypassed)"

  mode_4:
    name: "Independent/Summed Loop Ins Combination"
    description: "混合獨立與合併模式"
    use_case: "複雜路由需求"
    signal_flow: "Flexible routing combination"

  mode_5:
    name: "Loop Select"
    description: "在 Loop 1 和 Loop 2 之間切換"
    use_case: "A/B loop 切換 (例: Loop 1 = Gain pedals, Loop 2 = Modulation)"
    signal_flow: "Input → Loop 1 OR Loop 2 → Output"

  mode_6:
    name: "Loop Sum Select"
    description: "Loop 合併後切換"
    use_case: "Summed loops vs bypass"
    signal_flow: "Input → Loop 1 + Loop 2 (summed) OR bypass"

  mode_7:
    name: "Momentary Loop Switching"
    description: "瞬間啟動 loop (類似 Flexi-Switch)"
    use_case: "Temporary effects (按住時啟動，放開時 bypass)"
    signal_flow: "Input → Loop (momentary activation)"
    note: "🆕 Buffer++ 新增功能 (vs Stereo Buffer+)"

  mode_8:
    name: "Momentary Loop Sum"
    description: "瞬間啟動 summed loops"
    use_case: "Temporary parallel effects"
    signal_flow: "Input → Loop 1 + Loop 2 (momentary summed)"
    note: "🆕 Buffer++ 新增功能 (vs Stereo Buffer+)"

  mode_9:
    name: "Instrument Select – Mono Loops"
    description: "在兩個 input 間切換，mono loops"
    use_case: "兩把吉他切換 (mono 效果器鏈)"
    signal_flow: "Input 1 OR Input 2 → Loop 1 → Loop 2 (mono) → Output"

  mode_10:
    name: "Instrument Select – Summed Loops"
    description: "在兩個 input 間切換，summed loops"
    use_case: "兩把吉他 + parallel effects"
    signal_flow: "Input 1 OR Input 2 → Loop 1 + Loop 2 (summed) → Output"

  mode_11:
    name: "Instrument Select – Independent (Stereo) Loops"
    description: "在兩個 input 間切換，stereo loops"
    use_case: "兩把吉他 + stereo effects"
    signal_flow: "Input 1 OR Input 2 → Loop 1 → Loop 2 (stereo) → Output (stereo)"

  mode_12:
    name: "Instrument Select – Separate Rigs, Shared Effects"
    description: "兩個 input，分離 rig，共享 effects"
    use_case: "兩把吉他/兩台音箱/共享效果器"
    signal_flow: "Input 1 OR Input 2 → Shared loops → Output A OR Output B"

# 核心功能特性
core_features:
  buffering:
    type: "All-analog, pristine transparent buffering"
    quality: "Professional-grade, maintains tone integrity"
    purpose: "Prevent signal loss in long cable runs and complex pedalboards"

  stereo_capability:
    description: "True stereo signal paths"
    loops: "Loop 2 supports full stereo"
    outputs: "2 outputs for stereo or dual-mono"
    benefit: "Preserve stereo effects (delay, reverb) spatial imaging"

  noise_management:
    dolby_filtering:
      description: "Dolby-style noise filtering"
      benefit: "Eliminates noise and hiss from high-gain or vintage FX"
      note: "Does not compromise tone"

    transformer_isolation:
      location: "Output B"
      benefit: "Prevents ground loops and hum in dual-amp setups"
      note: "Essential for avoiding ground loop issues"

    differential_fx_returns:
      description: "Differential FX loop returns"
      benefit: "Reject unwanted noise from effects"

  input_features:
    metering:
      description: "Visual input metering (LED indicators)"
      benefit: "Prevent clipping, monitor signal levels"
      use_case: "Essential for active pickups, synths, hot signals"

    pads:
      description: "Switchable input pads"
      benefit: "Handle hot signals without clipping"
      use_case: "Active pickups (EMG), synths, line-level sources"

    variable_loading:
      description: "Variable input loading"
      benefit: "Simulate warm roll-off of long cables"
      use_case: "Tone shaping, vintage sound emulation"
      effect: "Adjusts pickup high-frequency response"

  boost:
    gain_range: "Up to 30dB"
    type: "Clean boost"
    activation: "Footswitchable"
    use_case: "Solo boost, signal recovery, drive pedal boost"

  ab_switching:
    description: "AB/AY instrument & amp switching"
    capability: "Toggle between instruments, amps, or loop paths"
    use_case: "Quick switching between guitars or dual-amp setups"

# 與 Swiss Things 比較
vs_swiss_things:
  advantages:
    - name: "Stereo Capability"
      buffer_plus_plus: "✅ Full stereo (Loop 2)"
      swiss_things: "❌ Mono only"
      impact: "巨大差異 - 可充分發揮 stereo effects"

    - name: "Routing Flexibility"
      buffer_plus_plus: "✅ 12 routing modes"
      swiss_things: "❌ Fixed 2-loop design"
      impact: "極度靈活 vs 固定角色"

    - name: "Inputs"
      buffer_plus_plus: "✅ 2 inputs"
      swiss_things: "❌ 1 input"
      impact: "可快速換吉他，無需拔線"

    - name: "Input Metering"
      buffer_plus_plus: "✅ Visual metering"
      swiss_things: "❌ No metering"
      impact: "防止削波，監控訊號"

    - name: "Input Pads"
      buffer_plus_plus: "✅ Switchable pads"
      swiss_things: "❌ No pads"
      impact: "處理熱訊號 (active pickups)"

    - name: "Variable Input Loading"
      buffer_plus_plus: "✅ Adjustable"
      swiss_things: "❌ Fixed"
      impact: "音色調整能力"

    - name: "Boost Range"
      buffer_plus_plus: "✅ 30dB"
      swiss_things: "❌ 20dB"
      impact: "更大 boost 能力"

    - name: "Momentary Switching"
      buffer_plus_plus: "✅ Mode 7 & 8"
      swiss_things: "✅ Flexi-Switch"
      impact: "兩者都有"

  disadvantages:
    - name: "Expression Pedal"
      buffer_plus_plus: "❌ No expression jack"
      swiss_things: "✅ Expression pedal volume"
      impact: "Swiss Things 優勢"

    - name: "Dedicated Loop Design"
      buffer_plus_plus: "❌ Configurable (需設定)"
      swiss_things: "✅ Loop 1 unbuffered, Loop 2 buffered"
      impact: "Swiss Things 更簡單直覺"

  price_comparison:
    buffer_plus_plus: "$299 USD (promotion)"
    swiss_things: "$299 USD (MSRP)"
    conclusion: "同價，但 Buffer++ 功能更多"

