# 不要混淆的同名或相關產品
variants_to_distinguish:
  - "ProCo RAT 2（SKU RAT2）：矽二極體，沒有 Ruetz 鈕，沒有削波切換 [official／independent]"
  - "ProCo Turbo RAT（SKU TRAT）：紅色 LED 削波，沒有 Ruetz 鈕 [official／independent]"
  - "ProCo You Dirty RAT：鍺二極體 1N34A，現行版改用 BAT-41 Schottky [independent，JHS]。RAAT 的 Ge 檔官方說用的是真鍺管，不是 Schottky"
  - "Aion FX Helios：RAAT 使用的 PCB 平台本身。原廠 Mode 是 Si 一對／Si 兩對串聯／只剩 LED，與 RAAT 的 Ge／LED／Si 不同 [independent]"
  - "Aion FX Heliosphere（站內網址 heliosphere-dual-distortion，Aion 標示基於 Stamps Drive-O-Matic）：名字相近，不是 RAAT 的平台 [independent]"
  - "Device2 其他商品（From Yesterday 等）：見 from_yesterday_kot.yaml"

