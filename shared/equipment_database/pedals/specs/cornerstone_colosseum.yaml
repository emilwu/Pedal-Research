    four_jacks_official: "[official] 產品頁：「Four rear jacks allow you to integrate each side independently with your favorite looper or insert other pedals in between.」手冊：「4 jacks to connect each side of the pedal with your favorite looper. You can use the sides independently or put any other pedal in between.」"

