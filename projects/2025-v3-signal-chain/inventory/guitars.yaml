    pickup_upgrade_status: "尚未換裝。研究建議先用原廠拾音器彈 2–4 週；若要換，推薦 Lundgren Heaven 57 neck + Heaven 67 bridge（皆 50mm 版）"
    notes: "原廠 A2 是 Alnico 2 vintage 輸出 PAF，四芯線，每顆可獨立切單。Lundgren 換裝研究見 projects/2025-v3-signal-chain/research/lundgren_pickup_selection_2026-09.md"

