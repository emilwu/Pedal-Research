  frequency:
    low: "飽滿、緊實"
    mid: "溫暖、甜美、圓潤"
    high: "平滑、存在感 (略少於Compact Deluxe的光澤)"

  dynamics:
    character: "超快速、精準、富彈性"
    parallel_compression: "DRY控制實現紐約式平行壓縮"

