      conflicts_with_official: "官方手冊 V2.2 的 RATIO 段建議「高比例配低 IN、低比例配高 IN」。本組是高 IN + 高 ratio，正好是官方說不要的組合。本檔不代為修改使用者自訂的 preset，只標註衝突"

    funk_rhythm:
      in: "中"
      out: "Unity或略高"
      attack: "快"
      release: "中至快"
      ratio: "中至高"
      dry: "60-80%"

