  - "IC 是圓形金屬罐（NEC C156A）還是一般 8 腳黑色晶片？上面印什麼？"
  - "削波 LED 是什麼顏色？"
  - "三段撥桿左、中、右各是 Ge、LED、Si 的哪一個？"
