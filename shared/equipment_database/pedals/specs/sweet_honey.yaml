# Mad Professor Sweet Honey Overdrive Deluxe
# 效果器詳細技術資料
# 資料來源: projects/2025-v3-signal-chain/research/overdrive_pedals_technical_data.md

version: 1.0
last_updated: 2025-12-30

# 基本資訊
basic_info:
  id: "sweet_honey"
  brand: "Mad Professor"
  model: "Sweet Honey Overdrive Deluxe"
  full_name: "Mad Professor Sweet Honey Overdrive Deluxe"
  type: "overdrive"
  subtype: "transparent_warm"
  circuit_basis: "Honey Bee circuit evolution"
  # 2026-10-13 補（網站稽核 AUDIT-2026-10-13 #24）：官方手冊末頁署名 "Mad Professor Amplification Ltd / Finland"
  country: "Finland"  # [official] 官方 SHOD DLX Owner's Manual

# 價格資訊
price:
  msrp: 220
  currency: "USD"
  tier: "mid_high_end"

# 核心技術規格
technical_specs:
  power:
    voltage: "9V DC (centre negative) or 9V Battery"  # [official] 手冊 Power requirements："6F22 9V battery or DC eliminator 2.1 mm plug center negative and positive sleeve"
    # 2026-10-13 新增：官方 "Supply voltage range: 7.5 to 18VDC"；手冊同時寫 "Use recommended voltage for best results"，18V 是上限不是建議值
    max_voltage: "18V DC（官方供電範圍 7.5–18V DC）"  # [official]
    # 2026-10-13 改：5mA -> 6 mA。官方 "Current consumption at 9VDC: 6 mA"
    current: "6 mA"  # [official] 於 9V DC
    battery: true  # [official] 6F22 9V

  controls:
    - name: "Volume"
      function: "輸出音量"
    - name: "Drive"
      function: "增益量控制"
    - name: "Focus"
      function: "調整動態響應與整體 EQ"
    - name: "Treble"
      function: "後級高頻控制 (post-gain)"
      # 2026-10-13 補（網站稽核 #24）：官方手冊原文
      official_text: "[official] TREBLE, post distortion, it cuts and/or boosts the treble."
    - name: "Bass"
      function: "前級低頻控制 (pre-gain)"
      # 2026-10-13 補（網站稽核 #24）：官方手冊原文，Bass 在失真之前，決定低頻與低中頻如何被失真
      official_text: "[official] BASS, pre distortion, it sets how the bass and low mids are distorted."
      effect_on_distortion: "[official] 會改變低頻與低中頻的失真方式"

  bypass: "True Bypass"  # [official] 手冊 "Complete bypass (true bypass)"

# 音色特性
tonal_characteristics:
  gain_type: "Low-Medium Gain Overdrive"
  design_approach: "Touch-sensitive, Medium gain amplifier-like overdrive"
  tone_goal: "Warm, natural tone with dynamic control"

  frequency:
    low: "可調整 (Bass 控制在 pre-gain)"
    low_note: "[official] Bass 在失真之前，決定低頻與低中頻如何被失真（見 controls.Bass.official_text）"
    mid: "溫暖、飽滿"
    high: "可調整 (Treble 控制在 post-gain)"

  dynamics:
    pick_sensitivity: "極高"
    volume_sensitivity: "高"
    compression: "適中且可調"

  gain:
    breakup_point: "可調 (透過 Focus)"
    gain_range: "Low to Medium (比 Tube Screamer 稍低)"
    harmonics: "溫暖、豐富,偏偶次諧波"

# Focus 控制特性
focus_control:
  name: "FOCUS"
  description: "調整動態響應與整體 EQ"
  # 2026-10-13 補：官方手冊 "A good starting point is 11 o'clock."
  official_starting_point: "11 點鐘"  # [official]
  ccw:
    setting: "逆時針"
    behavior: "需要更用力彈奏才產生失真"
    tone: "音色較柔和"
    best_for: "Jazz/Blues"
  cw:
    setting: "順時針"
    behavior: "更早產生失真"
    tone: "帶有輕微高頻提升"
    best_for: "Classic Rock"

# 使用建議
usage_recommendations:
  best_for:
    - "Jazz"
    - "Blues"
    - "Post Rock"
    - "Neo Soul"
    - "Funk"
    - "Warm overdrive"

  not_suitable_for:
    - "High-gain Modern Rock"
    - "Metal"

  signal_chain_position: "Signal chain 前段 (在 compressor, EQ 之後)"

  stacking:
    description: "與其他 overdrive 疊加效果優異"

  recommended_settings:
    general:
      volume: "3 點鐘"
      drive: "12 點鐘"
      focus: "1-2 點鐘"  # [inference] 本庫的使用建議，不是官方值；官方起點是 11 點鐘（見 focus_control.official_starting_point）

  features:
    - "Honey Bee circuit evolution"
    - "FOCUS control"
    - "Warm, sweet tone"
    - "Low to medium gain"

# 阻抗特性
# 2026-10-13 改：input "~1MΩ (標準)" -> "390kΩ"；output "~10-50kΩ (預估)" -> "25kΩ"
# 來源：官方手冊 "Input impedance: 390K Ohms"、"Output impedance: 25K Ohms"
impedance:
  input: "390kΩ"   # [official]
  output: "25kΩ"   # [official]

# 與其他踏板比較
comparisons:
  vs_sweet_honey_standard:
    difference: "Deluxe 版本增加獨立 Bass/Treble 控制,提供更多音色塑造能力"

  vs_tube_screamer:
    transparency: "更開放、更透明"
    dynamics: "動態範圍更大"

  vs_klon_style:
    tone: "更溫暖"
    mids: "較少中頻突出"

# 評價
review_summary:
  pros:
    - "極度觸鍵敏感,動態控制優異"
    - "適合「always-on」使用模式"
    - "特別受 Post-Rock 音樂人喜愛"
    - "獨立 Bass/Treble 控制提供更多音色塑造能力"

  alternative:
    name: "Joyo Sweet Baby"
    description: "較便宜的替代選擇"

# 訊號鏈配置
signal_chain:
  position: "pre_amp_gain"

  signal_routing:
    current_router: "swiss_things"
    legacy_swiss_things: "loop_1"
    planned_buffer_plus_plus: "loop_1"
    migration_notes: "Routing remains same (loop_1 on both routers)"

  notes: "訊號鏈1核心溫暖 OD，Neo Soul 甜蜜點"

