# 基本資訊
basic_info:
  id: "esp_throbber_ctm"   # 保留舊 id，不改。散在 41 個檔案裡
  brand: "ESP"
  model: "THROBBER-STD"
  full_name: "ESP THROBBER-STD"
  series: "Original Series"
  aliases: ["Throbber-CTM", "ESP Throbber-CTM"]   # 本庫與其他文件的舊稱，ESP 沒有這個型號
  made_in: "Japan"
  year: null  # 未知年份

# 價格資訊
price:
  msrp: null       # 本庫未記實際購入價
  currency: "USD"
