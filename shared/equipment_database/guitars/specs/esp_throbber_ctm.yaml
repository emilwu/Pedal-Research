# 拾音器配置
pickups:
  neck:
    model: "Seymour Duncan APH-1n (Alnico Pro Humbucker Neck)"
    type: "passive_humbucker"
    output: "medium"
    magnets: "Alnico II"
    characteristics:
      - "Vintage PAF-style tone"
      - "Warm, balanced output"
      - "Smooth, rich harmonics"
      - "Excellent for jazz and blues"

  bridge:
    model: "Seymour Duncan TB-APH-1b (Alnico Pro Humbucker Trembucker Bridge)"
    type: "passive_humbucker"
    output: "medium"
    magnets: "Alnico II"
    characteristics:
      - "Vintage PAF-style tone"
      - "Balanced, articulate"
      - "Warm mids, clear highs"
      - "Trembucker spacing for wider string spacing"

  pickup_set:
    name: "Seymour Duncan Alnico Pro Humbucker Set"
    description: "Vintage PAF-inspired passive humbuckers"
    designed_for: "Jazz, Blues, Classic Rock, versatile tones"
    era: "Vintage-voiced modern pickups"
    stock_vs_actual: |
      2026-09-12 使用者確認：實機就是 APH-1n / TB-APH-1b，本檔記載正確。
      ESP 官方上位機種 THROBBER 的原廠拾音器是 ESP Custom Lab CL-P-H-2n / CL-P-H-2b，
      所以這把的拾音器是換過的。本檔記實機現況。

  controls:
    - "Volume (共用)"
    - "Tone (共用)"
    - "5-Way Lever PU Selector"
  # 2026-09-12 更正：原本列四顆（Volume 頸/橋、Tone 頸/橋）。
  # 使用者確認實機是兩顆旋鈕：Master Volume + Master Tone。
  # 這與 ESP 官方上位機種 THROBBER 的 CONTROL 欄一致。

  # 2026-09-11：使用者確認實機規格，爭議已結案。
  pickup_selector:
    switch_type: "5-Way Lever PU Selector"
    position_count: 5
    positions: null
    position_names_status: "官方文件從不命名檔位。ESP 從產品頁到 20 頁的 OWNER'S MANUAL 都只標開關型態"
    resolved: |
      原本本檔寫「3-way pickup selector」。2026-09-11 經使用者確認實機為
      **ESP Original Series 的上位機種 THROBBER，5 檔撥桿**，已更正。
      這與 ESP 官方規格一致——Throbber 家族（THROBBER、THROBBER-STD、
      Exhibition Limited Throbber CTM FL）官方一律是 5-Way Lever PU Selector。
    do_not_guess: "官方不命名檔位，不要用「雙 humbucker 就是 Neck/Both/Bridge」這種推論填 positions。而且這是 5 檔不是 3 檔，那個推論連檔數都不對"

  # 型號識別：本檔的 id 與 model 沿用舊名，實機是上位機種 THROBBER
  model_identity:
    actual_model: "ESP Original Series THROBBER（上位機種）"
    recorded_as: "Throbber-CTM"
    why_not_renamed: |
      id esp_throbber_ctm 與「Throbber-CTM」這個名字散在 Pedal-Research 41 個檔案、
      Pedal-Web-Service-Planning 7 個檔案。改名的波及範圍遠大於收益，因此保留原名，
      只在此記錄實機型號，供日後比對官方規格時使用。
    official_reference: "比對官方規格時請看 ESP Original Series THROBBER（上位機種），不是 THROBBER-STD，也不是副牌 Edwards 的 E-THROBBER-CTM"
    confirmed_2026_09_12:
      knob_count: "兩顆：Master Volume + Master Tone。與 ESP 官方上位機種 THROBBER 一致。本檔原記四顆，已更正"
      pickups: |
        Neck 是 Seymour Duncan APH-1n、Bridge 是 Seymour Duncan TB-APH-1b，
        與本檔既有記載一致，不需更正。
        **但這表示拾音器被換過**：ESP 官方上位機種 THROBBER 原配是
        ESP Custom Lab CL-P-H-2n / CL-P-H-2b。本檔記的是實機現況，官方規格是原廠配置，
        兩者都對，只是描述不同時間點。查官方規格時要知道這個落差。
    all_resolved: "型號、檔數、旋鈕數量、拾音器四項皆已由使用者確認實機。本檔無待確認項目"

