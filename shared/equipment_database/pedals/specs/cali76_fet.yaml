# 核心技術規格
technical_specs:
  power:
    voltage: "9V DC, 2.1mm 中心負極"
    current_draw: "200mA（手冊要求供應器 >200mA）"
    internal_boost: "9V→24V"
    headroom: "大量Headroom"
    battery: false
    note: "僅變壓器,不支援電池"

  compression:
    type: "FET (1176風格)"
    characteristic: "全類比 FET 壓縮"
    threshold: "固定閾值設計"
    attack: "0.2ms ~ 4.8ms，全順時針為最快（反向旋鈕）"
    release: "69.5ms ~ 398ms，全順時針為最快"
    ratio: "4:1 ~ 20:1 可調"
    # 2026-09-11 修正：ratio 原本寫「固定 (1176風格)」，與同檔 controls 陣列
    # 列出的 RATIO「壓縮比例選擇」自我矛盾。官方手冊 V2.2 p.7-8 明寫固定的是
    # threshold 不是 ratio：「signals that exceed the fixed threshold」，
    # RATIO 段則寫「ranges from a ratio of 4:1 all the way to 20:1」。
    # threshold 那行本來就對，未動。

  # 面板六旋鈕，上排 DRY / OUT / IN，下排 RATIO / ATTACK / RELEASE。
  # 面板上沒有任何切換開關。2026-09-11 依官方手冊 V2.2 補上範圍與型態。
  controls:
    - name: "IN"
      function: "設定訊號電平 → 更多壓縮"
      control_kind: "continuous"
    - name: "OUT"
      function: "輸出電平補償 + Boost"
      control_kind: "continuous"
    - name: "ATTACK"
      function: "壓縮啟動速度"
      control_kind: "continuous"
      range: "0.2ms ~ 4.8ms"
      direction: "全順時針 = 最快（與多數壓縮器相反）"
    - name: "RELEASE"
      function: "壓縮恢復速度"
      control_kind: "continuous"
      range: "69.5ms ~ 398ms"
      direction: "全順時針 = 最快"
    - name: "RATIO"
      function: "壓縮比例，順時針增加"
      control_kind: "continuous"
      range: "4:1 ~ 20:1"
      note: "這是連續範圍的兩個端點，不是 1176 錄音室機那種 4/8/12/20 四顆比例按鍵。官方面板圖顯示它與其他五個是同樣的圓形旋鈕"
      caveat: "官方文件從未使用 continuous / stepped / detented 任一字眼。「無段」是從 min/max 措辭與範例圖指針任意角度推得的，不是官方明文"
    - name: "DRY"
      function: "乾濕混合 (平行壓縮)"
      control_kind: "continuous"
      unity_position: "約 2 點鐘"
      max_boost: "全順時針 +9dB"

  visual_feedback:
    type: "10-LED增益衰減指示器"
    scale: "dB刻度"

  bypass: "Buffered Bypass (電子切換,低雜訊)"

  size:
    dimensions: "124 (L) x 64 (D) x 58 (H) mm，含旋鈕與開關"
    weight: "553 g"
    boxed: "135 x 90 x 85 mm / 661 g（盒裝，勿與未裝盒數值混用）"
    # 2026-09-11 修正：原本寫「約140x76x51mm / 類似Boss尺寸」，兩者都與官方不符。
    # 官方產品頁規格表與手冊 Appendix A 皆為 124 x 64 x 58 mm、553 g。
    # 「類似 Boss 尺寸」一併移除：Boss compact 約 73 x 129 x 59 mm，軸向與數值都對不上。

# 音色特性
tonal_characteristics:
