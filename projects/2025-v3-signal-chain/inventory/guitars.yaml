  - id: "pearson_omega_6"
    brand: "Pearson Instruments"
    model: "Omega 6 Standard"
    full_name: "Pearson Instruments Omega 6 Standard"   # 顏色與五金記在 finish、hardware_finish
    year: 2026
    finish: "Wasp Yellow（粉體塗裝）"
    hardware_finish: "Chrome"
    headless: true

    # 拾音器資訊（原廠）
    # 阻值：Omega 產品頁寫 7.0k/8.1k，2025 年 A2 單賣頁寫 7.2k/8.4k，兩個都是官方數字；Hyper B 實測 7.27k/8.41k
    pickup_neck: "Pearson A2 Vintage Output Neck (Alnico 2, 7.0–7.2k)"
    pickup_bridge: "Pearson A2 Vintage Output Bridge (Alnico 2, 8.1–8.4k)"
    pickup_type: "passive_humbucker"
    pickup_set: "Pearson A2 Vintage Output"
    output_level: "medium"   # 官方稱 "lower output classic PAF"；與 Throbber 的 APH-1 同級，歸 medium
    coil_split: "individual"   # 每顆拾音器各一個 mini toggle，出廠就有

    # 琴身資訊
    # 琴身沒有木頭，是鋁板加不鏽鋼的開放式框架，所以 body_wood 填 null，材質記在 body_material
    body_wood: null
    body_material: "2mm 5052 Aluminum + 2mm 304 Stainless Steel frame"
    body_type: "metal_frame"   # 新分類。Web-Service 目前 bodyType 只有 solid/semi_hollow/hollow，匯入時需要加對應
    neck_wood: "Roasted Maple"
    neck_construction: "bolt_on"
    fingerboard_wood: "Rosewood"
    scale_length: "25.5"
    neck_option: "straight_fret"   # 官方另有 25"–25.5" multiscale 選項，本機不是

    # 特殊設計
    special_features:
      - "無頭設計，Gotoh GHL-2 鎖弦"
      - "每顆拾音器獨立切單（mini toggle）"
      - "拾音器掛在支柱與壓片上，沒有拾音器槽與 ring"

    # 使用狀態
    status: "active"
    acquired_date: null

