data_collected: 2026-01-10
data_updated: 2026-09-11
data_reliability: "高 (官方手冊 Ver 1.3)"
data_note: |
  2026-09-11 依官方手冊補齊 controls 區塊。原本的「待手冊確認」已解除。
  仍未解決的項目：
  - EQ 頻率點的單位未在手冊印出（推定 Hz，不寫成事實）
  - 延遲時間上限手冊內部有兩種寫法（參數表 10.0 s / 正文 9,999 msec），兩面都記
  - TRAIL 預設值手冊內部矛盾（參數表 Off / 正文 On），兩面都記
  - Soft Clipping 的 GAIN 與 LEVEL 沒有數值範圍
  - TONE 參數的濾波器型態與轉折頻率未說明
  - MODULATION 的 RATE 沒有 Hz 或 BPM 對照
  - release_year 與 msrp 仍為 null（官方頁與手冊皆未記載）
  - 面板控制件總數是清點面板圖得到的，建議日後以實機再確認
