amps:
  - id: "tone_king_imperial_mkii"
    brand: "Tone King"
    model: "Imperial MKII"
    full_name: "Tone King Imperial MKII Preamp"
    type: "tube_preamp"
    status: "active"
    acquired_date: null

    # 規格
    channels:
      - "Clean"
      - "Lead"
    power: "preamp_only"  # 這是 preamp，非 power amp
    speaker: null
    wattage: null

    # 特性
    features:
      - "Tube preamp"
      - "FX Send/Return (Effects Loop)"
      - "Mid-Bite switch"
      - "Rhythm/Lead channels"
      - "Professional recording preamp"

    # Effects Loop
    has_fx_loop: true
    fx_loop_type: "series"

    # 使用建議
    best_for:
      - "Recording"
      - "4-Cable Method"
      - "Professional tone shaping"

    # 適合音樂風格
    suitable_styles:
      - "Jazz"
      - "Blues"
      - "Rock"
      - "Fusion"
      - "Post Rock"

    # 訊號鏈配置
    signal_chain_method: "4cm"  # 4-Cable Method

    research_file: "shared/equipment_database/amps/specs/tone_king_imperial_mkii.yaml"
    notes: "專業 tube preamp，有 FX loop 適合 4CM 配置，主要用於錄音"

  - id: "roland_jc22"
    brand: "Roland"
    model: "JC-22 Jazz Chorus"
    full_name: "Roland JC-22 Jazz Chorus"
    type: "solid_state_combo"
    status: "active"
    acquired_date: null

    # 規格
    channels:
      - "Single channel"
    power: "combo"
    speaker: "2x 6.5 inch"
    wattage: 30

    # 特性
    features:
      - "Built-in stereo chorus"
      - "Clean headroom"
      - "Classic Jazz Chorus tone"
      - "BRIGHT switch"
      - "Stereo FX loop (mono send, stereo L/R return)"

    # Effects Loop
    # 2026-09-11 修正，依據見本檔末的「JC-22 FX loop 修正記錄」。
    has_fx_loop: true
    fx_loop_type: "stereo (mono send, stereo L/MONO + R return)"

    # 使用建議
    best_for:
      - "Jazz"
      - "Neo Soul"
      - "Funk"
      - "Clean tones"
      - "Stereo chorus"

    # 適合音樂風格
    suitable_styles:
      - "Jazz"
      - "Neo Soul"
      - "Funk"
      - "Pop Rock"
      - "Clean styles"

    # 訊號鏈配置
    signal_chain_method: "pre_amp_or_fx_loop"  # 兩種接法都可行，不是只能放前級

    # 內建效果
    built_in_effects:
      - effect: "chorus"
        type: "stereo"
        controls:
          - "SPEED"
          - "DEPTH"

    research_file: "shared/equipment_database/amps/specs/roland_jc22.yaml"
    notes: "經典 Jazz Chorus 晶體機，有 stereo FX loop（mono send / stereo return），前級接法與 FX loop 接法皆可，內建 stereo chorus"

