  klon_side:
    type: "Klon-style with Clip Blender"
    design_approach: "維持經典 Klon 架構並增加 Clip Blender"

    frequency:
      low: "飽滿"
      mid: "經典 Klon 中頻提升"
      high: "清晰"

    dynamics:
      pick_sensitivity: "高"
      volume_sensitivity: "高"
      compression: "適中"

    gain:
      breakup_point: "可調"
      gain_range: "Clean boost to Medium"
      harmonics: "豐富,可透過 Clip Blender 調整"

    clip_blender:
      description: "混合 Germanium 與 Silicon diodes"
      germanium: "Hand-selected 1N34A (原版 Klon)"
      silicon: "新增 Silicon diodes"
      effect: "提供從 Germanium 到 Silicon 的連續變化"
      knob_direction: "逆時針轉到底（面板左側 Ge 標示）＝純 Germanium（原版 Klon 1N34A）；順時針轉到底（面板右側 Si 標示）＝純 Silicon；中間連續混合 [official]（官方手冊 PDF 第 1 頁面板圖與實機照片）"

# Clean Control (BB Side)
clean_control:
  name: "CLEAN"
  description: "混入原始乾訊號"
  source: "來自 Cornerstone Gladio"
  purpose: "增加音色塑造彈性與透明度"

# Clip Blender (Klon Side)
clip_blender:
  name: "CLIP BLENDER"
  description: "混合兩種 clipping 特性"
  # 2026-10-13：舊版寫 germanium_mode「順時針最小」、silicon_mode「順時針最大」（兩種讀法都通，已改寫）。
  knob_direction: "逆時針轉到底（面板左側 Ge 標示）＝純 Germanium（原版 Klon 1N34A）；順時針轉到底（面板右側 Si 標示）＝純 Silicon；中間連續混合 [official]"
  knob_direction_source: "[official] 官方手冊 PDF 第 1 頁：Builder's Settings 面板圖與實機照片，CLIP 旋鈕左側印 Ge、右側印 Si。手冊第 2 頁的電路示意圖把 SILICON 畫在左、GERMANIUM 畫在右，那是訊號流向圖，不代表旋鈕方向；方向以面板絲印為準。產品頁沒有寫方向"
  official_instruction: "[official] 手冊：「Start with clipping all the way over to the Germanium side. Sweep towards silicon while playing to find your sweet spot.」"
  germanium_mode:
    setting: "逆時針轉到底（面板左側 Ge）[official]"
    effect: "Pure Germanium clipping (原版 Klon)"
    tone: "溫暖、有機"
  silicon_mode:
    setting: "順時針轉到底（面板右側 Si）[official]"
    effect: "Pure Silicon clipping"
    tone: "更清晰、更多 headroom"
    official_note: "[official] 手冊：「A pair of silicon diodes have been selected to offer a harder clipping texture but still retains the core Klon sound.」"
  blend:
    description: "可連續調整兩種 clipping 比例"
    official_wording: "[official] 產品頁：「blend between the classic Klon sound and a fresh new flavor」；手冊：「going from full Germanium to full Silicon, an entirely new flavor of Klon ... while still being able to harness the sound of the original」"

# Order Toggle
order_toggle:
  name: "ORDER TOGGLE"
  description: "切換兩個通道順序"
  mode_1:
    setting: "BB → Klon"
    character: "BB 基礎音色 + Klon 推動"
  mode_2:
    setting: "Klon → BB"
    character: "Klon 基礎音色 + BB 開放感"
  note: "兩種順序音色差異明顯"
  official_wording: "[official] 產品頁：「A toggle switch easily changes the order of the two channels, unlocking even more sonic possibilities.」官方沒有描述兩種順序各自的音色（例如偏 Lead 或偏 Rhythm）"

