# ESP THROBBER-STD
# 吉他詳細技術資料
#
# 2026-09-12：型號經使用者確認為 ESP Original Series THROBBER-STD。
# 琴身／琴頸／指板／硬體四個區塊原本與官方規格七個欄位全部不符，已照官方改。
# 來源：https://espguitars.co.jp/product/2873/（現行產品頁，本庫親自逐字核對）
#
# id 仍為 esp_throbber_ctm，沒有改。理由見 pickups.model_identity.why_not_renamed。

