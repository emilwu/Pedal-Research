# 與庫存設備相性
equipment_pairing:
  amps:
    jc22:
      compatibility: "✅ 完美配對"
      reason: "JC-22 有 stereo FX loop，Buffer++ Loop 2 stereo 可充分發揮 stereo speakers"
      configuration: |
        Guitar → Buffer++ Input
        → Buffer++ Loop 1 [Gain pedals]
        → Buffer++ Output → JC-22 INPUT
        → JC-22 FX SEND → Buffer++ Loop 2 Input
        → Buffer++ Loop 2 [Stereo effects: FF-1Y, Nucleo, AASB]
        → Buffer++ Loop 2 Output L → JC-22 FX RETURN L
        → Buffer++ Loop 2 Output R → JC-22 FX RETURN R
        → JC-22 Power Amp → Stereo Speakers
      benefit: "單台音箱即可享受完整 stereo"

    tone_king_imperial:
      compatibility: "✅ 完美配對"
      reason: "Tone King 有 stereo FX return + stereo XLR outputs，Buffer++ 可完整發揮"
      configuration: |
        Guitar → Buffer++ Input
        → Buffer++ Loop 1 [Gain pedals]
        → Buffer++ Output → Tone King INPUT
        → Tone King FX SEND → Buffer++ Loop 2 Input
        → Buffer++ Loop 2 [Stereo effects]
        → Buffer++ Loop 2 Output L → Tone King FX RETURN L
        → Buffer++ Loop 2 Output R → Tone King FX RETURN R
        → Tone King XLR OUTPUT L/R → Audio Interface (stereo recording)
      benefit: "完整 stereo XLR 錄音"

  pedals:
    stereo_effects:
      - name: "Nucleo (Stereo Reverb)"
        compatibility: "✅ 完美發揮"
        reason: "Buffer++ Loop 2 stereo 可保留 Nucleo 完整 stereo imaging"
        current_issue: "目前 Swiss Things mono，浪費 stereo 能力"

      - name: "FF-1Y (Delay)"
        compatibility: "✅ 適合"
        reason: "可在 Loop 2 stereo 使用"

      - name: "AASB (Shimmer Reverb)"
        compatibility: "✅ 適合"
        reason: "如果 AASB 有 stereo，可充分發揮"

    gain_pedals:
      - name: "All 6 Overdrives"
        compatibility: "✅ 適合"
        reason: "可放在 Loop 1，根據 routing mode 選擇 buffered/unbuffered"
        routing: "可使用適合 gain pedals 的 routing mode"

  guitars:
    esp_eclipse_ctm:
      compatibility: "✅ 完美配對"
      reason: "EMG active pickups 高輸出，Buffer++ input metering + pads 可防止削波"
      benefit: "視覺化監控訊號，避免 input clipping"

    all_guitars:
      compatibility: "✅ 適合"
      reason: "2 inputs 可同時連接兩把吉他，快速切換"
      use_case: "Instrument Select modes (9-12) 專為多吉他設計"

# 推薦訊號鏈配置
signal_chain_recommendations:
  config_1:
    name: "Stereo Pedalboard + JC-22"
    description: "充分發揮 JC-22 stereo speakers"
    routing_mode: "Mode 1 - Independent (Stereo) Loops"
    signal_flow: |
      Guitar → [Always-on: Empress MKII, Cali76, PA-1QG]
           → Buffer++ Input
           → Buffer++ Loop 1 [Gain pedals: Horsemeat, Sweet Honey, Morning Glory]
           → Buffer++ Output → JC-22 INPUT
           → JC-22 FX SEND → Buffer++ Loop 2 Input
           → Buffer++ Loop 2 [Stereo: FF-1Y, Nucleo, AASB]
           → Buffer++ Loop 2 L/R → JC-22 FX RETURN L/R
           → JC-22 Stereo Speakers
    benefit:
      - "完整 stereo 體驗"
      - "Nucleo stereo reverb 完整發揮"
      - "單台音箱即可享受 stereo"

  config_2:
    name: "Stereo Recording + Tone King"
    description: "專業 stereo 錄音設置"
    routing_mode: "Mode 1 - Independent (Stereo) Loops"
    signal_flow: |
      Guitar → [Always-on pedals]
           → Buffer++ Input
           → Buffer++ Loop 1 [Gain pedals: Blacklon, Source Code, ODL-1-CS]
           → Buffer++ Output → Tone King INPUT
           → Tone King FX SEND → Buffer++ Loop 2 Input
           → Buffer++ Loop 2 [Stereo effects]
           → Buffer++ Loop 2 L/R → Tone King FX RETURN L/R
           → Tone King XLR L/R → Audio Interface (stereo)
    benefit:
      - "完整 stereo XLR 錄音"
      - "Tube preamp 音色 + stereo effects"
      - "Silent recording"

  config_3:
    name: "Dual Guitar Setup"
    description: "兩把吉他快速切換"
    routing_mode: "Mode 11 - Instrument Select (Stereo Loops)"
    signal_flow: |
      Input 1: ESP Eclipse CTM (EMG active, high output)
      Input 2: Throbber-CTM (SD APH-1, medium output)
           → Buffer++ (auto-switch inputs)
           → Buffer++ Loop 1 [Gain pedals]
           → Buffer++ Loop 2 [Stereo effects]
           → Output (stereo)
    benefit:
      - "快速換吉他，無需拔線"
      - "Input metering 避免 Eclipse EMG 削波"
      - "保留 stereo 能力"

  config_4:
    name: "Dual Amp Stereo Rig"
    description: "終極 stereo 設置"
    routing_mode: "Mode 1 - Independent (Stereo) Loops"
    signal_flow: |
      Guitar → Buffer++ Input
           → Loop 1 [Gain pedals]
           → Loop 2 [Stereo effects]
           → Output A (Left) → JC-22 (via FX loop)
           → Output B (Right) → Tone King (via FX loop)
    benefit:
      - "完整發揮兩台音箱 stereo 能力"
      - "極致 stereo 空間感"

