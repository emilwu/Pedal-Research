  official_list: "616,000 yen（未稅 560,000 yen）"   # ESP 現行產品頁定價，非購入價

# 琴身規格
body:
  # 2026-09-12 照官方改。原記 Honduras Mahogany / semi-hollow / set-neck 全部不符。
  wood: "Alder"
  construction: "Semi-hollow with Sound Reservoir chamber"
  type: "semi_hollow"
  thickness: "45mm"
  # type 的依據是**擁有者確認**，不是 ESP 官方用詞。兩者的關係見下方 esp_own_wording。
  # 2026-09-12：本庫一度把 type 改成 chambered，理由寫「官方寫 Sound Reservoir，
  # 不是 semi-hollow」。那是把「有專有名稱」誤當成「屬於另一個分類」，已改回。
  esp_own_wording:
    term: "特殊ホロウ形状（名稱為 Sound Reservoir／サウンドリザーバー）"
    quote: "新たに採用された特殊ホロウ形状の名称はSound Reservoir（サウンドリザーバー）と言います"
    source: "https://espguitars.co.jp/product/2873/ 的 SPECIAL FEATURES 段落"
    never_uses: "產品頁逐字掃描：セミホロウ 0 次、semi-hollow 0 次、チェンバー 0 次。ESP 在產品頁上只用「ホロウ」"
    site_taxonomy: "espguitars.co.jp 自家標籤把 THROBBER-STD 歸在 SemiAcoustic（見 /tag/semiacoustic/）"
    do_not_cite_one_way: |
      ESP テクニカルハウス 部落格有一篇開發者訪談，句中出現
      「チェンバード構造（シンライン等も）では…セミアコ的なサウンドに辿り着けない」。
      **不要拿這句當「官方排除 chambered」的證據。**它把 Thinline 也歸進 chambered，
      而 Thinline 正是 semi-hollow 的原型，所以那句對兩種分類同樣不利，不具鑑別力。
      本庫 2026-09-12 一度想這樣單向引用，被查核擋下。
  shape: "Single cutaway with unique body shape"
  finish: null  # 本庫未記實機顏色。官方現行有 3 Tone Sunburst / Smoky Brown / Dark Metallic Green
  binding: "Ivory Binding"
  spec_verbatim: "Alder (Sound Reservoir) w/Ivory Binding (Thickness 45mm)"

  special_features:
    - name: "Sound Reservoir"
      description: "ESP 專利空腔設計"
      effect: "增加 resonance 和 sustain，溫暖音色"
      note: "Sound Reservoir 與 semi-hollow 不是互斥分類。本庫一度把它們當成互斥而改錯了 type 欄位"

# 琴頸規格
neck:
  # 2026-09-12 照官方改。原記 Mahogany / set_neck / 24.75 inch 全部不符。
  wood: "Hard Maple"
  construction: "bolt_on"
  joint: "T-5 Ultimate Access"
  head_type: "CT System Head Type-3"
  profile: "Slim U"                    # 官方 GRIP SHAPE 欄
  scale_length: "648mm (25.5 inch)"
  frets: "22 frets"
  fret_material: "M-SS"
  nut_width: "42mm"                    # 官方 NUT 欄
  nut_material: "Unbleached Bone"      # 官方 NUT 欄
  # 2026-09-12：上面四欄原本標「官方未記載」，那是錯的——2873 頁的
  # GRIP SHAPE 與 NUT 兩欄都有值。本庫第一次核對時只抄了規格表的一部分。
  field_split_note: "官方規格表只有單一個 CONSTRUCTION 欄，值是整串「Bolt-on (T-5 Ultimate Access)」。本庫拆成 construction 與 joint 兩欄，是本庫自己的拆解，不是官方欄位"

# 指板規格
fingerboard:
  # 2026-09-12 照官方改。原記 Ebony，不符。
  wood: "Indian Rosewood"
  radius: "Compound (240-305R)"                        # 官方 RADIUS 欄
  inlays: "(Top)MOP Dot, (Side)Luminlay SGM-23"        # 官方 INLAY 欄
  # 2026-09-12：兩欄原本標「官方未記載」，那是錯的

# 拾音器配置
pickups:
  neck:
    model: "Seymour Duncan APH-1n (Alnico Pro Humbucker Neck)"
    type: "passive_humbucker"
    output: "medium"
    magnets: "Alnico II"
    characteristics:
      - "Vintage PAF-style tone"
      - "Warm, balanced output"
      - "Smooth, rich harmonics"
      - "Excellent for jazz and blues"

  bridge:
    model: "Seymour Duncan TB-APH-1b (Alnico Pro Humbucker Trembucker Bridge)"
    type: "passive_humbucker"
    output: "medium"
    magnets: "Alnico II"
    characteristics:
      - "Vintage PAF-style tone"
      - "Balanced, articulate"
      - "Warm mids, clear highs"
      - "Trembucker spacing for wider string spacing"

  pickup_set:
    name: "Seymour Duncan Alnico Pro Humbucker Set"
    description: "Vintage PAF-inspired passive humbuckers"
    designed_for: "Jazz, Blues, Classic Rock, versatile tones"
    era: "Vintage-voiced modern pickups"
    confirmed: "2026-09-12 使用者確認實機：Neck 是 Seymour Duncan APH-1n、Bridge 是 TB-APH-1b"
    matches_current_official: |
      與 ESP 現行 THROBBER-STD 的官方規格**完全一致**：
      「(Neck) Seymour Duncan APH-1n, (Bridge) Seymour Duncan TB-APH-1b」。
      來源見 model_identity.catalogue_reference。沒有落差，不需要任何解釋。

  controls:
    - "Volume (共用)"
    - "Tone (共用)"
    - "5-Way Lever PU Selector"
  # 2026-09-12 更正：原本列四顆（Volume 頸/橋、Tone 頸/橋）。
  # 使用者確認實機是兩顆旋鈕：Master Volume + Master Tone。
  # 這與 ESP 官方上位機種 THROBBER 的 CONTROL 欄一致。

  # 2026-09-11：使用者確認實機規格，爭議已結案。
  pickup_selector:
    switch_type: "5-Way Lever PU Selector"
    position_count: 5
    positions: null
    position_names_status: "官方文件從不命名檔位。ESP 從產品頁到 20 頁的 OWNER'S MANUAL 都只標開關型態"
    resolved: |
      原本本檔寫「3-way pickup selector」。2026-09-11 經使用者確認實機為
      **ESP Original Series 的上位機種 THROBBER，5 檔撥桿**，已更正。
      這與 ESP 官方規格一致——Throbber 家族（THROBBER、THROBBER-STD、
      Exhibition Limited Throbber CTM FL）官方一律是 5-Way Lever PU Selector。
    do_not_guess: "官方不命名檔位，不要用「雙 humbucker 就是 Neck/Both/Bridge」這種推論填 positions。而且這是 5 檔不是 3 檔，那個推論連檔數都不對"

  # 型號識別：本檔的 id 與 model 沿用舊名，實機是上位機種 THROBBER
  model_identity:
    actual_model: "ESP Original Series 的 Throbber 琴型。拾音器、旋鈕數、檔數三項與現行 THROBBER-STD 相符；琴身與琴頸規格未確認（見 unresolved_body_and_neck）"
    recorded_as: "Throbber-CTM"
    why_not_renamed: |
      id esp_throbber_ctm 與「Throbber-CTM」這個名字散在 Pedal-Research 41 個檔案、
      Pedal-Web-Service-Planning 7 個檔案。改名的波及範圍遠大於收益，因此保留原名，
      只在此記錄實機型號，供日後比對官方規格時使用。
    official_reference: |
      比對官方規格時用 catalogue_reference 的現行 URL。
      **不要用 deprecated_source 那個舊頁面**，它是 2021 年之前的廢棄頁，網站首頁沒有入口。
      也不要用副牌 Edwards 的 E-THROBBER-CTM，那是不同型號。
    confirmed_2026_09_12:
      knob_count: "兩顆：Master Volume + Master Tone。本檔原記四顆，已更正"
      pickups: "Neck 是 Seymour Duncan APH-1n、Bridge 是 TB-APH-1b，與本檔既有記載一致，不需更正"

    # ESP 現行產品頁的規格。2026-09-12 由本 session 親自開啟逐字核對。
    catalogue_reference:
      model_on_page: "THROBBER-STD"
      index_url: "https://espguitars.co.jp/products/throbber"
      product_urls:
        - "https://espguitars.co.jp/product/2873/"   # 3 Tone Sunburst
        - "https://espguitars.co.jp/product/2874/"   # Smoky Brown
      # 2026-09-12 第二次核對，補齊全部 18 欄。第一次只抄了 10 欄，
      # 漏掉 GRIP SHAPE / RADIUS / NUT / INLAY / TUNER / PARTS COLOR / SET STRINGS，
      # 導致本檔六個欄位被誤標成「官方未記載」。
      spec_verbatim:
        BODY: "Alder (Sound Reservoir) w/Ivory Binding (Thickness 45mm)"
        NECK: "Hard Maple (CT System Head Type-3)"
        GRIP_SHAPE: "Slim U"
        FINGERBOARD: "Indian Rosewood"
        RADIUS: "Compound (240-305R)"
        SCALE: "648mm"
        NUT: "Unbleached Bone(42mm)"
        INLAY: "(Top)MOP Dot, (Side)Luminlay SGM-23"
        FRET: "M-SS, 22frets"
        CONSTRUCTION: "Bolt-on (T-5 Ultimate Access)"
        TUNER: "GOTOH SG360-07 MG-T"
        BRIDGE: "ESP FIXED Bridge"
        PICKUPS: "(Neck) Seymour Duncan APH-1n, (Bridge) Seymour Duncan TB-APH-1b"
        PARTS_COLOR: "Chrome"
        CONTROLS: "Master Volume, Master Tone, 5-Way Lever PU Selector"
        SET_STRINGS: ".010-.046"
        PRICE: "616,000 yen (without tax: 560,000 yen)"
        JAN: "4515303287424"
      body_structure_note: "規格表沒有獨立的琴身結構欄。CONSTRUCTION 欄講的是琴頸接合方式，琴身空腔資訊只在 BODY 欄的括號裡（Sound Reservoir）"
      matches_actual: "PICKUPS 與 CONTROLS 兩欄與實機完全相符（使用者 2026-09-12 確認）"
      page_does_not_say:
        - "現行產品線沒有出現 THROBBER-CTM 或 CTM 字樣"
        - "現行 THROBBER 產品線只有 THROBBER-STD 與 TB SOLID 系列，沒有標示為上位機種的款式"

    # 已作廢的來源，留著避免有人再撿回去用
    deprecated_source:
      url: "https://espguitars.co.jp/original/throbber/throbber.html"
      what_it_says: "型號 THROBBER，PICKUPS 為 ESP Custom Lab CL-P-H-2n / CL-P-H-2b，PRICE 470,000yen"
      not_on_discon_page: |
        ESP JP 的生產終了頁 https://espguitars.co.jp/products/discon-esp-guitar
        列了 56 筆停產品，**完全沒有任何 THROBBER**（全文 THROB 零命中）。
        所以這個舊頁的 THROBBER 也不是「已下線並移到停產頁」，它就是一個沒被收進
        現行導覽與搜尋索引的孤兒頁。
      why_not_usable: |
        這是 2021 年以前舊機種的廢棄頁面，從 ESP 網站首頁沒有任何入口或路徑到得了。
        頁面本身還開得起來，引文也逐字正確——**但它不是現行規格**。
        2026-09-12 本庫一度拿它當唯一依據，推導出「實機拾音器與官方不同、可能被換過」。
        改用現行頁面後那個落差整個消失：現行 THROBBER-STD 原廠就是 APH-1n / TB-APH-1b。

    all_resolved: "旋鈕數量與拾音器兩項已由使用者確認實機，且與現行官方 THROBBER-STD 相符"

    body_and_neck_resolved_2026_09_12: |
      本檔的 body / neck / fingerboard / hardware 原本與現行官方 THROBBER-STD
      七個欄位全部不符（Honduras Mahogany vs Alder、set_neck vs Bolt-on、
      24.75" vs 648mm、Ebony vs Indian Rosewood 等）。

      使用者確認型號就是 THROBBER-STD，四個區塊已照官方規格更正。
      「Sound Reservoir」是本區塊唯一原本就對的欄位——那是 Throbber 的真實特徵。
      其餘原值看起來像是填了 Gibson 式預設值（mahogany / set-neck / ebony / 24.75"）。

